mimir:
  structuredConfig:
    alertmanager_storage:
      s3:
        bucket_name: mimir-${GRAFANA_ENV}-alertmanager
        endpoint: ${S3_ENDPOINT}
        access_key_id: ${S3_ACCESS_KEY}
        secret_access_key: ${S3_SECRET_KEY}
        http:
          insecure_skip_verify: ${S3_SKIP_VERIFY}
    blocks_storage:
      backend: s3
      s3:
        bucket_name: mimir-${GRAFANA_ENV}-blocks
        endpoint: ${S3_ENDPOINT}
        access_key_id: ${S3_ACCESS_KEY}
        secret_access_key: ${S3_SECRET_KEY}
        http:
          insecure_skip_verify: ${S3_SKIP_VERIFY}
    ruler_storage:
      s3:
        bucket_name: mimir-${GRAFANA_ENV}-ruler
        endpoint: ${S3_ENDPOINT}
        access_key_id: ${S3_ACCESS_KEY}
        secret_access_key: ${S3_SECRET_KEY}
        http:
          insecure_skip_verify: ${S3_SKIP_VERFIY}
    #ingest_storage:
    #  kafka:
    #    address: "mimir-kafka.monitoring.svc.cluster.local:9092"
    #    topic: mimir-ingest
    #    auto_create_topic_enabled: true
    #    auto_create_topic_default_parititions: 100
    usage_stats:
      enabled: false
    tenant_federation:
      enabled: true
