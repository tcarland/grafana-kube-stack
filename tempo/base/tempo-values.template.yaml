reportingEnabled: false

global:
  multitenancyEnabled: true
  image:
    registry: null
    pullSecrets: []

tempo:
  image:
    registry: docker.io
    repository: grafana/tempo'
    tag: 3.0.3
    pullSecrets: []
    pullPolicy: IfNotPresent
  
storage:
  trace:
    backend: s3
    s3:
      bucket: tempo-${GRAFANA_ENV}-traces
      endpoint: ${S3_ENDPOINT}
      access_key: ${S3_ACCESS_KEY}
      secret_key: ${S3_SECRET_KEY}
      insecure: false
      tls_insecure_skip_verify: ${S3_SKIP_VERIFY}

minio:
  enabled: false

ingest:
  kafka:
    #address: ${GRAFANA_ENV}-kafka-bootstrap.kafka.svc.cluster.local:9092
    address: kafka-mimir.monitoring.svc.cluster.local:9092
    topic: tempo-traces
    auto_create_topic_enabled: true
    auto_create_topic_default_partitions: 3

# Configuration for the block-builder (Tempo 3.0+)
# Consumes spans from Kafka and writes blocks to object storage.
# One replica per Kafka partition — replica count must equal ingest.kafka.auto_create_topic_default_partitions.
blockbuilder:
  enabled: true
  replicas: 3

# Configuration for the live-store (Tempo 3.0+)
# Consumes spans from Kafka and serves recent-data queries (last ~30 minutes).
# One replica per Kafka partition — replica count must equal ingest.kafka.auto_create_topic_default_partitions.
liveStore:
  enabled: true
  replicas: 3

backendScheduler:
  enabled: false

traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true
  jaeger:
    thriftHttp:
      enabled: true
  opencensus:
    enabled: false
  zipkin:
    enabled: false

distributor:
  replicas: 1
  config:
    log_received_spans:
      enabled: true

compactor:
  replicas: 1
  config:
    block_retention: 48h

querier:
  replicas: 1
  config:
    trace_by_id:
      query_timeout: 10s
    search:
      query_timeout: 30s
    max_concurrent_queries: 20

queryFrontend:
  query:
    enabled: false

metricsGenerator:
  enabled: false
  replicas: 1
  walEmptyDir:
    medium: "Memory"
    sizeLimit: 1Gi

memcached:
  enabled: true
  image:
    registry: null
    pullSecrets: []
    repository: memcached
    tag: 1.6.45-alpine

memcachedExporter:
  enabled: false
  image:
    registry: null
    pullSecrets: []
    repository: prom/memcached-exporter
    tag: v0.16.0

gateway:
  enabled: true
  image:
    registry: null
    repository: nginxinc/nginx-unprivileged
    tag: 1.31-alpine
  ingress:
    enabled: false
  basicAuth:
    enabled: true
    username: ${AGENT_USERNAME}
    password: ${AGENT_PASSWORD}
